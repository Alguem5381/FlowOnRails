name: Publish to NuGet

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: nuget-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Select and validate release package
        id: package
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: bash scripts/select-release-package.sh "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Restore dependencies
        run: dotnet restore FlowOnRails.slnx

      - name: Build
        run: dotnet build FlowOnRails.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test FlowOnRails.slnx --configuration Release --no-build --no-restore --verbosity normal

      - name: Test release selection
        run: python3 -m unittest discover -s tests/packaging -p 'test_*.py'

      - name: Pack base library
        run: dotnet pack src/FlowOnRails/FlowOnRails.csproj --configuration Release --no-build --no-restore --output ./artifacts/packages

      - name: Pack ASP.NET Core integration
        run: dotnet pack src/FlowOnRails.AspNetCore/FlowOnRails.AspNetCore.csproj --configuration Release --no-build --no-restore --output ./artifacts/packages

      - name: Verify isolated package consumers
        run: python3 scripts/verify-packages.py ./artifacts/packages

      - name: Verify satellite against its published base dependency
        if: steps.package.outputs.package_id == 'FlowOnRails.AspNetCore'
        run: python3 scripts/verify-packages.py ./artifacts/packages --published-base

      - name: NuGet Login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: alguem5381

      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          PACKAGE_FILE: ${{ steps.package.outputs.file }}
        run: >-
          dotnet nuget push "./artifacts/packages/$PACKAGE_FILE"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
